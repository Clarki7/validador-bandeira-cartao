<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validador de Bandeira de Cartão</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: #e8f1f5;
    }
    main { width: min(420px, 92vw); }
    h1 { font-size: 1.4rem; margin: 0 0 1rem; text-align: center; }
    .cartao {
      aspect-ratio: 1.586; border-radius: 16px; padding: 22px; margin-bottom: 1.2rem;
      background: linear-gradient(135deg, #36bcf7, #2c5364); box-shadow: 0 12px 30px rgba(0,0,0,.35);
      display: flex; flex-direction: column; justify-content: space-between; transition: background .4s;
    }
    .cartao.invalido { background: linear-gradient(135deg, #7a2e3a, #3a1c24); }
    .cartao.valido { background: linear-gradient(135deg, #1f9d6b, #14532d); }
    .chip { width: 46px; height: 34px; border-radius: 6px; background: linear-gradient(135deg, #f5d77a, #c79a2a); }
    .numero { font-family: "Courier New", monospace; font-size: 1.35rem; letter-spacing: 2px; }
    .bandeira { text-align: right; font-weight: 700; font-size: 1.1rem; }
    label { display: block; font-size: .9rem; margin-bottom: .4rem; opacity: .85; }
    input {
      width: 100%; padding: 14px; font-size: 1.1rem; border-radius: 10px; border: 1px solid #36bcf7;
      background: rgba(255,255,255,.08); color: inherit; outline: none; letter-spacing: 1px;
    }
    input:focus { box-shadow: 0 0 0 3px rgba(54,188,247,.35); }
    .resultado { margin-top: .9rem; min-height: 1.4em; text-align: center; font-weight: 600; }
    footer { margin-top: 1.5rem; text-align: center; font-size: .8rem; opacity: .7; }
    footer a { color: #36bcf7; }
  </style>
</head>
<body>
  <main>
    <h1>💳 Validador de Bandeira de Cartão</h1>

    <div class="cartao" id="cartao">
      <div class="chip"></div>
      <div class="numero" id="numero">•••• •••• •••• ••••</div>
      <div class="bandeira" id="bandeira">—</div>
    </div>

    <label for="entrada">Digite o número do cartão</label>
    <input id="entrada" inputmode="numeric" autocomplete="off" maxlength="23" placeholder="4111 1111 1111 1111" />
    <div class="resultado" id="resultado"></div>

    <footer>
      Tudo roda no seu navegador; nenhum número é enviado ou guardado.<br />
      Use apenas números de teste. Feito por <a href="https://github.com/Clarki7">Benjamin Clark</a>
    </footer>
  </main>

  <script src="src/index.js"></script>
  <script>
    const { validarCartao, identificarBandeira, limpar } = window.ValidadorCartao;
    const entrada = document.getElementById('entrada');
    const cartao = document.getElementById('cartao');

    entrada.addEventListener('input', () => {
      const d = limpar(entrada.value).slice(0, 19);
      entrada.value = d.replace(/(\d{4})(?=\d)/g, '$1 ');
      document.getElementById('numero').textContent =
        (d + '•'.repeat(Math.max(0, 16 - d.length))).replace(/(.{4})/g, '$1 ').trim();
      document.getElementById('bandeira').textContent = identificarBandeira(d) || '—';

      cartao.classList.remove('valido', 'invalido');
      const resultado = document.getElementById('resultado');
      if (d.length < 12) { resultado.textContent = ''; return; }
      const r = validarCartao(d);
      cartao.classList.add(r.valido ? 'valido' : 'invalido');
      resultado.textContent = r.valido ? `✅ ${r.bandeira} válido` : `❌ ${r.motivo}`;
    });
  </script>
</body>
</html>
